apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// 禁用 buildKotlinToolingMetadata 任务（Gradle 8.x 兼容性问题）
project.tasks.matching { it.name == 'buildKotlinToolingMetadata' }.configureEach {
    it.doNotTrackState('Incompatible with current Gradle version')
}

// 发布签名密钥：真实密码只从本地 keystore.properties 或环境变量读取，不入库
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file("keystore.properties")
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}
def resolveSecret = { String name, String fallback ->
    def value = keystoreProps.getProperty(name)
    if (value == null || value.isEmpty()) {
        value = System.getenv(name)
    }
    return (value == null || value.isEmpty()) ? fallback : value
}
def releaseKeyAlias = resolveSecret('RELEASE_KEY_ALIAS', 'mp4gif')
def releaseStorePassword = resolveSecret('RELEASE_STORE_PASSWORD', 'CHANGE_ME')
def releaseKeyPassword = resolveSecret('RELEASE_KEY_PASSWORD', 'CHANGE_ME')

android {
    namespace "com.local.mp4gif"
    compileSdk rootProject.ext.compileSdkVersion

    // 发布签名配置：密钥路径来自 gradle.properties，密码来自本地 keystore.properties
    signingConfigs {
        release {
            storeFile file(RELEASE_STORE_FILE)
            storePassword releaseStorePassword
            keyAlias releaseKeyAlias
            keyPassword releaseKeyPassword
        }
    }

    defaultConfig {
        applicationId "com.local.mp4gif"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "1.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        resConfigs 'zh', 'en'  // 只保留中英语言资源，移除其他50+语言
        ndk {
            // 全量打包 jniLibs 中已有的 gifski ABI，兼容真机与模拟器
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#L61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 正式发布签名（keystore 文件在 app/ 目录下，密码在 gradle.properties）
            signingConfig signingConfigs.release
        }
        debug {
            // debug签名也用release key，这样release和debug都是同一个签名
        }
    }

    packagingOptions {
        jniLibs {
            // 压缩 .so 文件到 APK 内（减小下载体积，代价是安装后占用更大）
            useLegacyPackaging = true
        }
        // 排除不必要的 META-INF 文件
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/ASL2.0'
        exclude 'META-INF/AL2.0'
        exclude 'META-INF/LGPL2.1'
        exclude 'META-INF/*.kotlin_module'
        exclude 'kotlin/*.kotlin_builtins'
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // JNA (Java Native Access) - gifski 原生库通过 JNA 调用 Rust FFI
    implementation 'net.java.dev.jna:jna:5.14.0@aar'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
