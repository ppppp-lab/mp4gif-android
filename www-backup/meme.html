<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0C0E12" />
  <title data-i18n-doc-title="meme.title">表情包工坊</title>
  <link rel="stylesheet" href="styles.css?v=20260731b" />
  <link rel="stylesheet" href="meme.css" />
  <link rel="stylesheet" href="ai-assistant.css" />
  <link rel="stylesheet" href="privacy-consent.css" />
</head>
<body>
<script src="i18n.js"></script>
<script src="privacy-consent.js"></script>
<div class="app meme-app">

  <!-- ============ 顶栏 ============ -->
  <header class="topbar meme-topbar">
    <button class="meme-back" id="btnBack">←</button>
    <!-- btnBack onclick 改为跳转 home.html -->
    <span class="meme-title" data-i18n="meme.title">表情包工坊</span>
    <div class="meme-top-actions">
      <button class="meme-icon-btn" id="btnUndo" data-i18n-title="meme.undo" title="撤销" disabled>↶</button>
      <button class="meme-icon-btn" id="btnRedo" data-i18n-title="meme.redo" title="重做" disabled>↷</button>
      <button class="meme-icon-btn" id="btnShare" data-i18n-title="meme.share" title="分享" disabled>↗</button>
      <button class="btn btn-accent btn-export-meme" id="btnExportMeme" disabled data-i18n="meme.export">导出</button>
    </div>
  </header>

  <!-- ============ 主内容区（侧边栏+画布） ============ -->
  <div class="meme-body">

    <!-- 左侧侧边栏 -->
    <aside class="meme-sidebar hidden" id="memeSidebar">
      <div class="meme-sidebar-tools">
        <button class="meme-sidebar-btn active" data-tool="text" data-i18n-title="meme.tool.text" title="文字">
          <span class="meme-tab-icon meme-tab-text-icon" data-i18n="meme.layer.textIcon">字</span>
        </button>
        <button class="meme-sidebar-btn" data-tool="filter" data-i18n-title="meme.tool.filter" title="滤镜">
          <span class="meme-tab-icon meme-tab-filter-icon">◐</span>
        </button>
        <button class="meme-sidebar-btn" data-tool="draw" data-i18n-title="meme.tool.draw" title="画笔">
          <span class="meme-tab-icon meme-tab-draw-icon">✎</span>
        </button>
        <button class="meme-sidebar-btn" data-tool="crop" data-i18n-title="meme.tool.crop" title="裁剪">
          <span class="meme-tab-icon meme-tab-crop-icon">⬚</span>
        </button>
        <button class="meme-sidebar-btn" data-tool="platform" data-i18n-title="meme.tool.platform" title="平台">
          <span class="meme-tab-icon meme-tab-platform-icon">⌘</span>
        </button>
        <button class="meme-sidebar-btn" data-tool="advanced" data-i18n-title="meme.tool.advanced" title="高级">
          <span class="meme-tab-icon meme-tab-advanced-icon">⧉</span>
        </button>
      </div>
      <div class="meme-sidebar-bottom"></div>
    </aside>

    <!-- 画布区域 -->
    <main class="meme-content">

      <!-- 预览画布 -->
      <div class="meme-stage" id="memeStage">
        <!-- 空状态 -->
        <div class="meme-empty" id="memeEmpty">
          <div class="meme-empty-icon">🎭</div>
          <div class="meme-empty-title" data-i18n="meme.empty.title">制作你的专属表情包</div>
          <div class="meme-empty-sub" data-i18n="meme.empty.sub">导入 GIF 或图片，加文字、滤镜、涂鸦，一键生成表情包</div>
          <div class="meme-empty-actions">
            <button class="btn btn-accent" id="btnImportGif" data-i18n="meme.import">导入素材</button>
          </div>
        </div>
        <!-- 画布容器 -->
        <div class="meme-canvas-wrap hidden" id="canvasWrap">
          <canvas id="memeCanvas"></canvas>

        </div>
      </div>

      <!-- 素材来源条（保留原位置，但在侧边栏显示后隐藏） -->
      <div class="meme-source hidden" id="memeSource">
        <span class="meme-source-label" data-i18n="meme.source">素材</span>
        <span class="meme-source-name" id="sourceName">—</span>
        <button class="chip chip-action" id="btnChangeSource" data-i18n="meme.change">换</button>
      </div>

    </main>
  </div>

  <!-- ============ AI 助手 ============ -->
  <button class="ai-fab hidden" id="aiFab" data-i18n-title="ai.open" title="AI">AI</button>
  <div class="ai-panel hidden" id="aiPanel">
    <div class="ai-panel-head">
      <span class="ai-panel-title" data-i18n="ai.title">AI 助手</span>
      <button class="ai-panel-close" id="aiPanelClose">×</button>
    </div>
    <div class="ai-status" id="aiStatus" data-i18n="ai.modelMissing">模型未就绪</div>
    <textarea class="ai-input" id="aiInput" rows="2" data-i18n-placeholder="ai.placeholder" placeholder="告诉我你想怎么制作表情包"></textarea>
    <div class="ai-actions">
      <button class="ai-download hidden" id="aiDownload" data-i18n="ai.download">下载模型</button>
      <button class="ai-send" id="aiSend" data-i18n="ai.send">生成</button>
    </div>
  </div>

  <!-- ============ 底部弹出面板 ============ -->
  <div class="meme-panel-overlay" id="memePanelOverlay"></div>
  <div class="meme-panel" id="memePanel">
    <!-- 拖拽条 + 标题 + 关闭按钮 -->
    <div class="meme-panel-header">
      <div class="meme-panel-drag-bar"></div>
      <span class="meme-panel-title" id="memePanelTitle" data-i18n="meme.tool.text">文字</span>
      <button class="meme-panel-close" id="memePanelClose">×</button>
    </div>
    <div class="meme-panel-body">

      <!-- 滤镜工具 -->
      <div class="panel-section" data-panel="filter">
        <div class="style-group">
          <label class="style-label" data-i18n="meme.filter.preset">预设</label>
          <div class="filter-presets">
            <button class="filter-preset active" data-preset="none" data-i18n="meme.filter.none">原图</button>
            <button class="filter-preset" data-preset="gray" data-i18n="meme.filter.gray">黑白</button>
            <button class="filter-preset" data-preset="sepia" data-i18n="meme.filter.sepia">复古</button>
            <button class="filter-preset" data-preset="cold" data-i18n="meme.filter.cold">冷色</button>
            <button class="filter-preset" data-preset="warm" data-i18n="meme.filter.warm">暖色</button>
            <button class="filter-preset" data-preset="invert" data-i18n="meme.filter.invert">反色</button>
          </div>
        </div>
        <div class="style-group">
          <label class="style-label"><span data-i18n="meme.filter.brightness">亮度</span> <strong id="brightnessVal">100</strong>%</label>
          <input class="range" type="range" id="brightnessRange" min="0" max="200" step="5" value="100" />
        </div>
        <div class="style-group">
          <label class="style-label"><span data-i18n="meme.filter.contrast">对比度</span> <strong id="contrastVal">100</strong>%</label>
          <input class="range" type="range" id="contrastRange" min="0" max="200" step="5" value="100" />
        </div>
        <div class="style-group">
          <label class="style-label"><span data-i18n="meme.filter.saturate">饱和度</span> <strong id="saturateVal">100</strong>%</label>
          <input class="range" type="range" id="saturateRange" min="0" max="200" step="5" value="100" />
        </div>
      </div>



      <!-- 裁剪工具 -->
      <div class="panel-section" data-panel="crop">
        <div class="style-group">
          <label class="style-label" data-i18n="meme.crop.ratio">比例</label>
          <div class="crop-chips">
            <button class="crop-chip active" data-crop="free" data-i18n="meme.crop.free">自由</button>
            <button class="crop-chip" data-crop="square" data-i18n="meme.crop.square">1:1 方形</button>
            <button class="crop-chip" data-crop="wide" data-i18n="meme.crop.wide">4:3 宽屏</button>
            <button class="crop-chip" data-crop="portrait" data-i18n="meme.crop.portrait">3:4 竖屏</button>
          </div>
        </div>
        <div class="style-group">
          <button class="btn btn-accent" id="btnApplyCrop" data-i18n="meme.crop.apply">应用裁剪</button>
          <button class="btn btn-xs btn-ghost" id="btnResetCrop" style="margin-left:8px" data-i18n="meme.crop.reset">重置</button>
        </div>
      </div>

      <!-- 平台工具 -->
      <div class="panel-section" data-panel="platform">
        <div class="style-group">
          <label class="style-label" data-i18n="meme.platform.preset">平台预设</label>
          <div class="platform-chips">
            <button class="platform-chip" data-platform="wechat" data-i18n="meme.platform.wechat">微信 300×300 1MB</button>
            <button class="platform-chip" data-platform="qq" data-i18n="meme.platform.qq">QQ 240×240 500KB</button>
            <button class="platform-chip" data-platform="xiaohongshu" data-i18n="meme.platform.xiaohongshu">小红书 360×360 2MB</button>
            <button class="platform-chip" data-platform="douyin" data-i18n="meme.platform.douyin">抖音 360×360 1MB</button>
          </div>
        </div>
        <div class="style-group">
          <label class="style-label" data-i18n="meme.platform.quick">快捷工具</label>
          <div class="platform-quick-btns">
            <button class="btn btn-xs btn-ghost" id="btnAddWhiteBorder" data-i18n="meme.platform.whiteBorder">⬜ 加白边</button>
            <button class="btn btn-xs btn-ghost" id="btnAddRoundCorner" data-i18n="meme.platform.roundCorner">⬭ 圆角</button>
          </div>
        </div>
      </div>

    </div><!-- /.meme-panel-body -->
  </div><!-- /.meme-panel -->

  <!-- ============ 文字全屏编辑 ============ -->
  <div class="text-fullscreen hidden" id="textFullscreen">
    <header class="fs-topbar">
      <button class="fs-back" id="textFsBack">←</button>
      <span class="fs-title" data-i18n="meme.text.title">编辑文字</span>
      <button class="fs-done" id="textFsDone">✓</button>
    </header>
    <div class="fs-canvas-area">
      <canvas id="textFsCanvas"></canvas>
    </div>
    <div class="fs-bottom">
      <div class="fs-bottom-scroll">
        <!-- 文字列表 + 添加按钮 -->
        <div class="fs-text-list-row">
          <div class="fs-text-list" id="textFsList"></div>
          <button class="btn btn-accent btn-xs" id="textFsAdd" data-i18n="meme.text.add">＋ 添加</button>
        </div>
        <!-- 文字内容输入 -->
        <textarea id="textFsInput" data-i18n-placeholder="meme.text.placeholder" placeholder="输入文字" rows="2"></textarea>
        <!-- 字体 -->
        <div class="style-group">
          <label class="style-label" data-i18n="meme.text.font">字体</label>
          <div class="font-chips" id="textFsFontChips">
            <button class="font-chip active" data-font="heavy" data-i18n="meme.text.fontHeavy">粗黑</button>
            <button class="font-chip" data-font="impact">Impact</button>
            <button class="font-chip" data-font="song" data-i18n="meme.text.fontSong">宋体</button>
            <button class="font-chip" data-font="kai" data-i18n="meme.text.fontKai">楷书</button>
            <button class="font-chip" data-font="mono" data-i18n="meme.text.fontMono">等宽</button>
          </div>
        </div>
        <!-- 颜色 -->
        <div class="style-group">
          <label class="style-label" data-i18n="meme.text.color">颜色</label>
          <div class="color-chips" id="textFsColorChips">
            <button class="color-chip active" data-color="#FFFFFF" style="background:#FFFFFF"></button>
            <button class="color-chip" data-color="#000000" style="background:#000000"></button>
            <button class="color-chip" data-color="#FF4747" style="background:#FF4747"></button>
            <button class="color-chip" data-color="#FFD93D" style="background:#FFD93D"></button>
            <button class="color-chip" data-color="#3DDC84" style="background:#3DDC84"></button>
            <button class="color-chip" data-color="#00C2FF" style="background:#00C2FF"></button>
            <button class="color-chip color-chip-add" id="btnTextFsAddColor" data-i18n-title="meme.text.customColor" title="自定义颜色">+</button>
          </div>
          <input type="color" id="textFsColorPicker" style="position:absolute;opacity:0;width:0;height:0;pointer-events:none" value="#FFFFFF" />
        </div>
        <!-- 大小 / 描边 -->
        <div class="style-row-2col">
          <div class="style-group">
            <label class="style-label"><span data-i18n="meme.text.size">大小</span> <strong id="textFsSizeVal">32</strong></label>
            <input class="range" type="range" id="textFsSizeRange" min="12" max="80" step="2" value="32" />
          </div>
          <div class="style-group">
            <label class="style-label"><span data-i18n="meme.text.stroke">描边</span> <strong id="textFsStrokeVal">3</strong></label>
            <input class="range" type="range" id="textFsStrokeRange" min="0" max="8" step="1" value="3" />
          </div>
        </div>
        <!-- 旋转 / 阴影 -->
        <div class="style-row-2col">
          <div class="style-group">
            <label class="style-label"><span data-i18n="meme.text.rotate">旋转</span> <strong id="textFsRotateVal">0°</strong></label>
            <input class="range" type="range" id="textFsRotateRange" min="-180" max="180" step="5" value="0" />
          </div>
          <div class="style-group">
            <label class="style-label" data-i18n="meme.text.shadow">阴影</label>
            <label class="toggle"><input type="checkbox" id="textFsShadowToggle" /><span class="toggle-track"></span></label>
          </div>
        </div>
        <!-- 删除 / 复制 -->
        <div class="text-actions">
          <button class="btn btn-xs btn-ghost" id="textFsDelete" data-i18n="meme.text.delete">删除</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ 画笔全屏编辑 ============ -->
  <div class="draw-fullscreen hidden" id="drawFullscreen">
    <header class="fs-topbar">
      <button class="fs-back" id="drawFsBack">←</button>
      <span class="fs-title" data-i18n="meme.draw.title">画笔</span>
      <button class="fs-done" id="drawFsDone">✓</button>
    </header>
    <div class="fs-canvas-area">
      <canvas id="drawFsCanvas"></canvas>
    </div>
    <div class="fs-bottom">
      <div class="fs-bottom-scroll">
        <!-- 模式 -->
        <div class="style-group">
          <label class="style-label" data-i18n="meme.draw.mode">模式</label>
          <div class="draw-mode-chips" id="drawFsModeChips">
            <button class="draw-mode-chip active" data-mode="pen" data-i18n="meme.draw.pen">画笔</button>
            <button class="draw-mode-chip" data-mode="eraser" data-i18n="meme.draw.eraser">橡皮擦</button>
            <button class="draw-mode-chip" data-mode="blur" data-i18n="meme.draw.blur">模糊</button>
            <button class="draw-mode-chip" data-mode="mosaic" data-i18n="meme.draw.mosaic">马赛克</button>
          </div>
        </div>
        <!-- 形状（仅画笔模式） -->
        <div class="style-group" id="drawFsShapeGroup">
          <label class="style-label" data-i18n="meme.draw.shape">形状</label>
          <div class="draw-shape-chips" id="drawFsShapeChips">
            <button class="draw-shape-chip active" data-shape="free" data-i18n-title="meme.draw.free" title="自由">✎</button>
            <button class="draw-shape-chip" data-shape="line" data-i18n-title="meme.draw.line" title="直线">╱</button>
            <button class="draw-shape-chip" data-shape="arrow" data-i18n-title="meme.draw.arrow" title="箭头">↗</button>
            <button class="draw-shape-chip" data-shape="rect" data-i18n-title="meme.draw.rect" title="矩形">▭</button>
            <button class="draw-shape-chip" data-shape="ellipse" data-i18n-title="meme.draw.ellipse" title="椭圆">○</button>
          </div>
        </div>
        <!-- 颜色（仅画笔模式） -->
        <div class="style-group" id="drawFsColorGroup">
          <label class="style-label" data-i18n="meme.draw.color">颜色</label>
          <div class="color-chips" id="drawFsColorChips">
            <button class="color-chip draw-fs-color active" data-color="#FF4747" style="background:#FF4747"></button>
            <button class="color-chip draw-fs-color" data-color="#FFD93D" style="background:#FFD93D"></button>
            <button class="color-chip draw-fs-color" data-color="#3DDC84" style="background:#3DDC84"></button>
            <button class="color-chip draw-fs-color" data-color="#00C2FF" style="background:#00C2FF"></button>
            <button class="color-chip draw-fs-color" data-color="#FFFFFF" style="background:#FFFFFF"></button>
            <button class="color-chip draw-fs-color" data-color="#000000" style="background:#000000"></button>
            <button class="color-chip color-chip-add" id="btnDrawFsAddColor" data-i18n-title="meme.text.customColor" title="自定义颜色">+</button>
          </div>
          <input type="color" id="drawFsColorPicker" style="position:absolute;opacity:0;width:0;height:0;pointer-events:none" value="#FF4747" />
        </div>
        <!-- 粗细 -->
        <div class="style-group" id="drawFsBrushGroup">
          <label class="style-label"><span data-i18n="meme.draw.brush">粗细</span> <strong id="drawFsBrushVal">4</strong>px</label>
          <input class="range" type="range" id="drawFsBrushRange" min="1" max="20" step="1" value="4" />
        </div>
        <!-- 马赛克块大小（仅马赛克模式） -->
        <div class="style-group hidden" id="drawFsMosaicGroup">
          <label class="style-label"><span data-i18n="meme.draw.mosaicSize">马赛克块</span> <strong id="drawFsMosaicVal">10</strong>px</label>
          <input class="range" type="range" id="drawFsMosaicRange" min="4" max="30" step="2" value="10" />
        </div>
        <!-- 清除涂鸦 -->
        <div class="text-actions">
          <button class="btn btn-xs btn-ghost" id="drawFsClear" data-i18n="meme.draw.clear">清除涂鸦</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ 裁剪全屏编辑 ============ -->
  <div class="crop-fullscreen hidden" id="cropFullscreen">
    <header class="fs-topbar">
      <button class="fs-back" id="cropFsBack">←</button>
      <span class="fs-title" data-i18n="meme.cropFull.title">裁剪</span>
      <button class="fs-done" id="cropFsDone">✓</button>
    </header>
    <div class="fs-canvas-area">
      <canvas id="cropFsCanvas"></canvas>
    </div>
    <div class="fs-bottom">
      <div class="fs-bottom-scroll">
        <div class="style-group">
          <label class="style-label" data-i18n="meme.crop.ratio">比例</label>
          <div class="crop-chips" id="cropFsChips">
            <button class="crop-chip active" data-crop="free" data-i18n="meme.crop.free">自由</button>
            <button class="crop-chip" data-crop="square">1:1</button>
            <button class="crop-chip" data-crop="wide">4:3</button>
            <button class="crop-chip" data-crop="portrait">3:4</button>
          </div>
        </div>
        <div class="style-group">
          <button class="btn btn-xs btn-ghost" id="cropFsReset" data-i18n="meme.cropFull.reset">重置选区</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ 高级剪辑全屏编辑 ============ -->
  <div class="advanced-fullscreen hidden" id="advancedFullscreen">
    <!-- 顶栏：返回 + 模式标签 + 工具按钮 -->
    <header class="adv-topbar">
      <button class="adv-back" id="advFsBack">←</button>
      <div class="adv-mode-tabs" id="advModeTabs">
        <button class="adv-mode-tab active" data-mode="keyframe" id="advModeKeyframe" data-i18n-title="meme.adv.manualKf" title="手动关键帧">
          <span class="adv-mode-icon">◆</span><span class="adv-mode-text" data-i18n="meme.adv.keyframe">关键帧</span>
        </button>
        <button class="adv-mode-tab" data-mode="track" id="advModeTrack" data-i18n-title="meme.adv.autoTrack" title="自动追踪">
          <span class="adv-mode-icon">⊕</span><span class="adv-mode-text" data-i18n="meme.adv.track">追踪</span>
        </button>
      </div>
      <div class="adv-topbar-actions">
        <button class="adv-icon-btn" id="advFsUndo" data-i18n-title="meme.adv.undo" title="撤销">↶</button>
        <button class="adv-action-btn" id="advFsAddImage" data-i18n-title="meme.adv.addImageTitle" title="添加图片图层">＋ 图片</button>
      </div>
    </header>

    <!-- 追踪模式提示条 -->
    <div class="adv-track-hint hidden" id="advTrackHint">
      <span class="adv-track-hint-text" id="advTrackHintText" data-i18n="meme.adv.hint.place">将图片放到目标位置，点击开始追踪</span>
      <div class="adv-track-hint-controls">
        <label class="adv-track-precision-label"><span data-i18n="meme.adv.precision">追踪密度</span>
          <input type="number" id="advTrackPrecision" class="adv-track-precision-input" min="1" max="10" value="1" step="1">
          <span class="adv-track-precision-unit" data-i18n="meme.adv.precisionUnit">帧/次</span>
        </label>
        <label class="adv-track-relative-label">
          <input type="checkbox" id="advTrackRelativeMode">
          <span class="adv-track-relative-text" data-i18n="meme.adv.relative">相对位置</span>
        </label>
        <button class="adv-track-hint-btn" id="advTrackStartBtn" data-i18n="meme.adv.startTrack">开始追踪</button>
      </div>
    </div>

    <!-- 画布区域 -->
    <div class="adv-canvas-area">
      <canvas id="advFsCanvas"></canvas>
      <!-- 追踪锚点标记 -->
      <div class="adv-track-anchor hidden" id="advTrackAnchor"></div>
      <div class="adv-empty" id="advFsEmpty">
        <div class="adv-empty-icon">⧉</div>
        <div class="adv-empty-text" data-i18n="meme.adv.emptyText">添加图片图层开始动画制作</div>
        <button class="btn btn-accent btn-xs" id="advFsEmptyAdd" data-i18n="meme.adv.emptyAdd">＋ 添加图片</button>
      </div>
    </div>

    <!-- 图层条 -->
    <div class="adv-layer-strip" id="advLayerStrip"></div>

    <!-- 参数控制区 -->
    <div class="adv-controls">
      <!-- 位置行：X + Y 合并一行 -->
      <div class="adv-ctrl-row">
        <div class="adv-ctrl-cell">
          <span class="adv-ctrl-label" data-i18n="meme.adv.posX">X</span>
          <input type="range" class="adv-range" id="advFsPosXRange" min="0" max="480" value="240">
          <span class="adv-ctrl-val" id="advFsPosXVal">240</span>
        </div>
        <div class="adv-ctrl-cell">
          <span class="adv-ctrl-label" data-i18n="meme.adv.posY">Y</span>
          <input type="range" class="adv-range" id="advFsPosYRange" min="0" max="480" value="240">
          <span class="adv-ctrl-val" id="advFsPosYVal">240</span>
        </div>
        <button class="adv-kf-btn" id="advFsPosKfBtn" data-i18n-title="meme.adv.posKf" title="位置关键帧">◆</button>
      </div>
      <!-- 变换行：缩放 + 旋转 合并一行 -->
      <div class="adv-ctrl-row">
        <div class="adv-ctrl-cell">
          <span class="adv-ctrl-label" data-i18n="meme.adv.scale">缩放</span>
          <input type="range" class="adv-range" id="advFsScaleRange" min="10" max="500" value="100">
          <span class="adv-ctrl-val" id="advFsScaleVal">100%</span>
        </div>
        <div class="adv-ctrl-cell">
          <span class="adv-ctrl-label" data-i18n="meme.adv.rotate">旋转</span>
          <input type="range" class="adv-range" id="advFsRotateRange" min="-180" max="180" value="0">
          <span class="adv-ctrl-val" id="advFsRotateVal">0°</span>
        </div>
        <button class="adv-kf-btn" id="advFsScaleKfBtn" data-i18n-title="meme.adv.scaleKf" title="缩放关键帧">◆</button>
        <button class="adv-kf-btn" id="advFsRotateKfBtn" data-i18n-title="meme.adv.rotKf" title="旋转关键帧">◆</button>
      </div>
      <!-- 播放控制行 -->
      <div class="adv-playback">
        <button class="adv-play-btn" id="advFsPlayBtn">▶</button>
        <span class="adv-timecode" id="advFsTimecode">00:00.00</span>
        <span class="adv-timecode-sep">/</span>
        <span class="adv-duration" id="advFsDuration">00:00.00</span>
      </div>
    </div>

    <!-- 时间轴 -->
    <div class="adv-timeline">
      <canvas id="advFsTimelineCanvas"></canvas>
      <div id="advPlayhead" class="adv-playhead-line"></div>
    </div>
  </div>

</div><!-- /.meme-app -->

<!-- ============ 模态 ============ -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBox">
    <div class="modal-title" id="modalTitle" data-i18n="converter.modalDefault">提示</div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>
<div class="toast-wrap" id="toastWrap"></div>
